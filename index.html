<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#fbf6ee"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E"><title>只寄给你的时光来信</title>
<style>
:root{--paper:#fbf6ee;--ink:#58433d;--rose:#984e5b;--soft:#9e8a7b;--line:#e0cdbd}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;display:grid;place-items:center;padding:40px 20px;overflow-x:hidden}body:before{content:'';position:fixed;width:670px;height:670px;border:1px solid #decdbb77;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}main{position:relative;width:min(100%,470px);text-align:center}.eyebrow{font-size:9px;letter-spacing:3px;color:var(--soft);margin-bottom:30px}.envelope{width:155px;height:102px;margin:10px auto 29px;position:relative;background:#e7c7b9;transform:rotate(-7deg);border-radius:3px;box-shadow:0 16px 30px #67473213}.envelope:before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);background:#eed4c6}.envelope:after{content:'♡';position:absolute;left:58px;top:39px;width:40px;height:40px;border-radius:50%;background:var(--rose);color:#f4d7cf;display:grid;place-items:center;font:25px Georgia;box-shadow:inset 0 0 0 4px #ae6870aa,0 3px 8px #60303922}.star{position:absolute;right:80px;top:50px;color:#bb9b74;font-size:26px}.star.small{left:67px;top:145px;right:auto;font-size:18px}h1{font:38px/1.65 'Noto Serif SC','Songti SC','SimSun',serif;font-weight:400;letter-spacing:2px;margin:0 0 14px}h1 em{font-style:normal;color:var(--rose)}.intro{font-size:12px;line-height:2.2;color:#9b8778;margin-bottom:29px}.form-card{padding:25px 26px 23px;background:#fffaf3;border:1px solid #e6d7c8;box-shadow:0 18px 50px #6d4d3010;border-radius:4px;text-align:left}label{display:block;font-size:11px;letter-spacing:1px;color:#8b7363;margin-bottom:10px}.input-wrap{position:relative}input{width:100%;padding:13px 59px 13px 13px;background:#fbf5eb;border:1px solid #dbc8b5;border-radius:3px;color:var(--ink);font:16px/1.5 system-ui;min-height:48px}input:focus-visible,button:focus-visible{outline:3px solid #c69a9d;outline-offset:4px}.reveal{position:absolute;right:7px;top:8px;border:0;background:transparent;color:#977865;font:11px 'Microsoft YaHei',sans-serif;padding:9px;cursor:pointer}.submit{width:100%;min-height:47px;border:0;border-radius:3px;background:var(--rose);color:#fff4e9;font:13px 'Microsoft YaHei',sans-serif;margin-top:14px;cursor:pointer;transition:background .2s}.submit:hover{background:#843d4b}.submit:disabled{opacity:.65;cursor:wait}.status{font-size:11px;color:#965867;line-height:1.9;min-height:22px;margin:12px 0 0;overflow-wrap:anywhere}.input-hint{font-size:10px;line-height:1.9;color:#9e8a7b;margin:9px 0 0}.hint{font-size:10px;color:#ad9786;line-height:2;margin:24px 0 0}.bottom{font-size:8px;letter-spacing:2px;color:#b59a85;margin-top:25px}.status[role=alert]{color:#a64554}@media(max-width:480px){body{padding:32px 22px}h1{font-size:32px}.form-card{padding:22px}.star{right:38px}.star.small{left:35px}body:before{width:490px;height:490px}.eyebrow{font-size:8px;letter-spacing:2px}.hint{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><div class="eyebrow">SOME WORDS ARE ONLY MEANT FOR TWO.</div><span class="star" aria-hidden="true">✧</span><span class="star small" aria-hidden="true">✦</span><div class="envelope" aria-hidden="true"></div><h1>这封时光来信，<br><em>只寄给你。</em></h1><p class="intro">那些舍不得忘记的小事，已经好好收在这里。<br>用我们的小口令，拆开这份喜欢。</p><form class="form-card" id="unlockForm"><label for="passphrase">我们的共享口令</label><div class="input-wrap"><input id="passphrase" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入口令，翻开我们的故事" required aria-describedby="inputHint unlockStatus"><button class="reveal" type="button" id="revealPassword" aria-pressed="true">隐藏</button></div><p class="input-hint" id="inputHint">支持中文输入，口令默认可见；输入后可点「隐藏」。</p><button class="submit" type="button" id="unlockButton" disabled>正在准备拆信……</button><p class="status" id="unlockStatus" role="status" aria-live="polite">正在准备输入框，请稍候。</p><p class="input-hint" id="browserHelp" hidden>微信内若无法打开：点右上角「…」，选择「在浏览器打开」，再输入口令。</p></form><p class="hint">口令不会发送到服务器，也不会被此页面保存。<br>关闭或刷新页面后，下次需要重新拆信。</p><div class="bottom">A LITTLE ARCHIVE OF US · PRIVATE LETTER<br><span style="display:inline-block;margin-top:9px;letter-spacing:1px">手机版 · 03</span></div><noscript><p>请启用 JavaScript 后打开这封信。</p></noscript></main>
<script>
(function () {
  'use strict';
  var form = document.getElementById('unlockForm');
  var input = document.getElementById('passphrase');
  var button = document.getElementById('unlockButton');
  var status = document.getElementById('unlockStatus');
  var reveal = document.getElementById('revealPassword');
  var hint = document.getElementById('inputHint');
  var help = document.getElementById('browserHelp');
  var payloadUrl = './memory.enc.json?v=4c3cfc82eb55a10c';
  var composing = false, compositionEndedAt = 0, busy = false;
  var cachedPayload = null, attempt = 0, activeRequest = null;

  function message(text, isError) {
    status.textContent = text;
    status.setAttribute('role', isError ? 'alert' : 'status');
  }
  function problem(kind, text) {
    var error = new Error(text);
    error.kind = kind;
    return error;
  }
  function decode(value) {
    var binary = atob(value), bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function readPayload(token) {
    if (cachedPayload) return Promise.resolve(cachedPayload);
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      activeRequest = xhr;
      xhr.open('GET', payloadUrl, true);
      xhr.timeout = 60000;
      xhr.onprogress = function (event) {
        if (attempt !== token) return;
        var progress = event.lengthComputable
          ? Math.round(event.loaded / event.total * 100) + '%'
          : (event.loaded / 1048576).toFixed(1) + ' MB';
        button.textContent = '正在取回回忆 · ' + progress;
        message('正在下载加密回忆（' + progress + '），请保持页面打开。', false);
      };
      xhr.onload = function () {
        if (attempt !== token) return;
        activeRequest = null;
        if (xhr.status < 200 || xhr.status >= 300) {
          reject(problem('network', '暂时没有取到回忆文件，请稍后重试；也可以从微信右上角选择「在浏览器打开」。'));
          return;
        }
        try {
          var payload = JSON.parse(xhr.responseText);
          if (payload.version !== 1 || payload.iterations !== 600000 ||
              typeof payload.salt !== 'string' || typeof payload.iv !== 'string' ||
              typeof payload.ciphertext !== 'string') throw new Error('Invalid payload');
          cachedPayload = payload;
          resolve(payload);
        } catch (error) {
          reject(problem('file', '回忆文件没有完整加载，请刷新后重试。'));
        }
      };
      xhr.onerror = function () {
        reject(problem('network', '网络连接没有成功，请检查网络后重试；微信内可选择「在浏览器打开」。'));
      };
      xhr.ontimeout = function () {
        reject(problem('network', '回忆文件下载超时，请换个网络，或从微信右上角选择「在浏览器打开」后重试。'));
      };
      xhr.onabort = function () { reject(problem('cancel', '本次加载已停止，可以重新拆信。')); };
      xhr.send();
    });
  }
  function startUnlock() {
    if (busy) return;
    // A deliberate tap must work even when a mobile IME omits compositionend.
    // Blurring commits the candidate; defer reading the final value one task.
    input.blur();
    composing = false;
    busy = true;
    button.disabled = true;
    button.textContent = '正在准备拆信……';
    message('已收到，正在准备打开这封信。', false);
    help.hidden = true;
    setTimeout(function () {
      var password = input.value.replace(/^\s+|\s+$/g, '');
      if (!password) {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('请先输入我们的小口令。', true); input.focus(); return;
      }
      if (window.location.protocol !== 'https:' &&
          window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost') {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('请使用 HTTPS 安全网址打开这封信。', true); help.hidden = false; return;
      }
      if (!window.crypto || !window.crypto.subtle || !window.Promise ||
          !window.TextEncoder || !window.TextDecoder) {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('当前浏览器暂不支持安全解密，请点微信右上角「…」选择「在浏览器打开」，使用 Safari、Chrome 或 Edge。', true);
        help.hidden = false; return;
      }
      var token = ++attempt;
      var deadline = setTimeout(function () {
        if (attempt !== token) return;
        attempt++;
        if (activeRequest) { activeRequest.abort(); activeRequest = null; }
        password = ''; busy = false; button.disabled = false; button.textContent = '重新拆信 ♡';
        message('等待时间有些长，请重试；微信内可从右上角选择「在浏览器打开」。', true);
        help.hidden = false;
      }, 90000);
      button.textContent = cachedPayload ? '正在轻轻拆开……' : '正在取回回忆……';
      message(cachedPayload ? '正在本机解密，请稍等片刻。' : '正在下载加密回忆，首次打开可能需要一点时间。', false);
      readPayload(token).then(function (payload) {
        if (attempt !== token) throw problem('cancel', 'Stopped');
        button.textContent = '正在轻轻拆开……';
        message('回忆已取回，正在你的手机上解密。', false);
        // Yield so the progress label paints before decoding the large payload.
        return new Promise(function (resolve) { setTimeout(function () { resolve(payload); }, 30); });
      }).then(function (payload) {
        if (attempt !== token) throw problem('cancel', 'Stopped');
        var encoder = new TextEncoder();
        return window.crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey'])
          .then(function (material) {
            return window.crypto.subtle.deriveKey({name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256'}, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
          }).then(function (key) {
            return window.crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(payload.iv), additionalData: encoder.encode('our-memory:html:v1'), tagLength: 128}, key, decode(payload.ciphertext));
          });
      }).then(function (plain) {
        if (attempt !== token) return;
        var html = new TextDecoder('utf-8', {fatal: true}).decode(plain);
        if (html.indexOf('<!doctype html>') !== 0) throw problem('file', '解密后的文件不完整，请刷新后重试。');
        clearTimeout(deadline);
        password = ''; input.value = '';
        document.open(); document.write(html); document.close();
      }).catch(function (error) {
        if (attempt !== token) return;
        clearTimeout(deadline);
        password = ''; busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message(error.kind ? error.message : '口令不匹配，或文件不完整。请核对文字及中英文标点后重试。', true);
        help.hidden = !!(error.kind === 'file');
      });
    }, 0);
  }

  reveal.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    reveal.textContent = show ? '隐藏' : '显示';
    reveal.setAttribute('aria-pressed', String(show));
    hint.textContent = show ? '支持中文输入，口令默认可见；输入后可点「隐藏」。' : '口令已隐藏。继续输入中文时，请先点「显示」。';
  });
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () { composing = false; compositionEndedAt = Date.now(); });
  input.addEventListener('blur', function () { composing = false; });
  input.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.keyCode !== 13) return;
    event.preventDefault();
    if (event.isComposing || composing || event.keyCode === 229 || Date.now() - compositionEndedAt < 100) return;
    startUnlock();
  });
  button.addEventListener('click', startUnlock);
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (composing) { message('请先选好汉字，再点「拆开来信」。', false); return; }
    startUnlock();
  });
  button.disabled = false;
  button.textContent = '拆开来信 ♡';
  message('输入口令后，点「拆开来信」打开回忆。', false);
}());

</script></body></html>
