</style></head><body><main><div class="eyebrow">SOME WORDS ARE ONLY MEANT FOR TWO.</div><span class="star" aria-hidden="true">✧</span><span class="star small" aria-hidden="true">✦</span><div class="envelope" aria-hidden="true"></div><h1>这封时光来信，<br><em>只寄给你。</em></h1><p class="intro">那些舍不得忘记的小事，已经好好收在这里。<br>用我们的小口令，拆开这份喜欢。<br>先读小小来信，完整聊天随时再翻。</p><form class="form-card" id="unlockForm"><label for="passphrase">我们的共享口令</label><div class="input-wrap"><input id="passphrase" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入口令，翻开我们的故事" required aria-describedby="inputHint unlockStatus"><button class="reveal" type="button" id="revealPassword" aria-pressed="true">隐藏</button></div><p class="input-hint" id="inputHint">支持中文输入，口令默认可见；输入后可点「隐藏」。</p><button class="submit" type="button" id="unlockButton" disabled>正在准备拆信……</button><p class="status" id="unlockStatus" role="status" aria-live="polite">正在准备输入框，请稍候。</p><p class="input-hint" id="browserHelp" hidden>微信内若无法打开：点右上角「…」，选择「在浏览器打开」，再输入口令。</p></form><p class="hint">口令不会发送到服务器，也不会被此页面保存。<br>关闭或刷新页面后，下次需要重新拆信。</p><div class="bottom">A LITTLE ARCHIVE OF US · PRIVATE LETTER<br><span style="display:inline-block;margin-top:9px;letter-spacing:1px">轻量纪念册 · 04</span></div><noscript><p>请启用 JavaScript 后打开这封信。</p></noscript></main>
<script>
(function () {
  'use strict';
  var form = document.getElementById('unlockForm');
  var input = document.getElementById('passphrase');
  var button = document.getElementById('unlockButton');
  var status = document.getElementById('unlockStatus');
  var reveal = document.getElementById('revealPassword');
  var hint = document.getElementById('inputHint');
  var help = document.getElementById('browserHelp');
  var composing = false, compositionEndedAt = 0, busy = false;
  var attempt = 0;

  function message(text, isError) {
    status.textContent = text;
    status.setAttribute('role', isError ? 'alert' : 'status');
  }
  function problem(kind, text) {
    var error = new Error(text);
    error.kind = kind;
    return error;
  }
  function decode(value) {
    var binary = atob(value), bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  // Installed only after the authenticated cover has been decrypted. The key is
// non-extractable, lives in this closure, and is discarded when the page closes.
function installArchiveLoader(key, expectedSalt) {
  var archiveBytes = null, archiveTask = null;
  window.__memoryArchiveBytes = function (onProgress) {
    if (archiveBytes) return Promise.resolve(archiveBytes);
    if (archiveTask) return archiveTask;
    function update(text) { if (typeof onProgress === 'function') onProgress(text); }
    archiveTask = new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest(), idleTimer, totalTimer, settled = false;
      function clear() { clearTimeout(idleTimer); clearTimeout(totalTimer); }
      function fail(text) {
        if (settled) return;
        settled = true; clear(); xhr.abort();
        update(text); reject(new Error(text));
      }
      function armIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          fail('完整聊天的网络连接暂时停住了。精选回忆仍可阅读，稍后可再次点击查找。');
        }, 60000);
      }
      xhr.open('GET', './memory.enc.json?v=4c3cfc82eb55a10c', true);
      // Keep a slow but progressing connection alive; this is not a 60s total timeout.
      xhr.timeout = 0;
      xhr.onprogress = function (event) {
        armIdleTimer();
        var loaded = (event.loaded / 1048576).toFixed(1);
        var label = event.lengthComputable ? Math.round(event.loaded / event.total * 100) + '%' : loaded + ' MB';
        update('正在取回完整聊天 · ' + label + '。精选回忆可以继续阅读。');
      };
      xhr.onload = function () {
        if (settled) return;
        if (xhr.status < 200 || xhr.status >= 300) { fail('暂时无法取回完整聊天，请稍后再试。精选回忆仍可阅读。'); return; }
        settled = true; clear();
        try {
          var payload = JSON.parse(xhr.responseText);
          if (payload.version !== 1 || payload.iterations !== 600000 || payload.salt !== expectedSalt) throw Error('Invalid archive metadata');
          update('完整聊天已取回，正在本机解密……');
          var decryptTimer = setTimeout(function () { reject(new Error('完整聊天解密用时较长，请稍后重新查找。')); }, 60000);
          window.crypto.subtle.decrypt({name:'AES-GCM', iv:decode(payload.iv), additionalData:new TextEncoder().encode('our-memory:html:v1'), tagLength:128}, key, decode(payload.ciphertext))
            .then(function (plain) {
              clearTimeout(decryptTimer);
              var text = new TextDecoder('utf-8', {fatal:true}).decode(plain);
              var match = text.match(/<script id="archiveData" type="application\/octet-stream">([A-Za-z0-9+/=\s]+)<\/script>/);
              if (!match) throw Error('Archive missing');
              archiveBytes = decode(match[1].replace(/\s/g, ''));
              update('完整聊天已就绪，继续查找无需重新下载。');
              resolve(archiveBytes);
            }).catch(function () { clearTimeout(decryptTimer); reject(new Error('完整聊天校验未通过，请刷新后重试。精选回忆不受影响。')); });
        } catch (error) { reject(new Error('完整聊天文件不完整，请稍后重新查找。')); }
      };
      xhr.onerror = function () { fail('网络未能连上完整聊天档案，请稍后再试。精选回忆仍可阅读。'); };
      xhr.onabort = function () { if (!settled) fail('已停止取回完整聊天，可以再次点击查找。'); };
      update('正在取回完整聊天档案（约 6.4 MB），这一步不影响浏览其他回忆。');
      armIdleTimer();
      totalTimer = setTimeout(function () { fail('完整聊天下载较慢，请换个网络后再试。精选回忆仍可阅读。'); }, 600000);
      xhr.send();
    }).catch(function (error) { archiveTask = null; throw error; });
    return archiveTask;
  };
}

  function readCover() {
    return new Promise(function (resolve, reject) {
      function read() {
        try {
          var node = document.getElementById('coverPayload');
          if (!node) throw Error('Missing cover');
          var payload = JSON.parse(node.textContent);
          if (payload.version !== 1 || payload.kind !== 'cover' || payload.iterations !== 600000) throw Error('Invalid cover');
          resolve(payload);
        } catch (error) { reject(problem('file', '这封小小来信还没有完整加载，请重新打开页面。')); }
      }
      if (document.readyState === 'loading' && !document.getElementById('coverPayload')) {
        document.addEventListener('DOMContentLoaded', read, {once:true});
      } else { read(); }
    });
  }
  function startUnlock() {
    if (busy) return;
    // A deliberate tap must work even when a mobile IME omits compositionend.
    // Blurring commits the candidate; defer reading the final value one task.
    input.blur();
    composing = false;
    busy = true;
    button.disabled = true;
    button.textContent = '正在准备拆信……';
    message('已收到，正在准备打开这封信。', false);
    help.hidden = true;
    setTimeout(function () {
      var password = input.value.replace(/^\s+|\s+$/g, '');
      if (!password) {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('请先输入我们的小口令。', true); input.focus(); return;
      }
      if (window.location.protocol !== 'https:' &&
          window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost') {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('请使用 HTTPS 安全网址打开这封信。', true); help.hidden = false; return;
      }
      if (!window.crypto || !window.crypto.subtle || !window.Promise ||
          !window.TextEncoder || !window.TextDecoder) {
        busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message('当前浏览器暂不支持安全解密，请点微信右上角「…」选择「在浏览器打开」，使用 Safari、Chrome 或 Edge。', true);
        help.hidden = false; return;
      }
      var token = ++attempt;
      var deadline = setTimeout(function () {
        if (attempt !== token) return;
        attempt++;
        password = ''; busy = false; button.disabled = false; button.textContent = '重新拆信 ♡';
        message('等待时间有些长，请重试；微信内可从右上角选择「在浏览器打开」。', true);
        help.hidden = false;
      }, 90000);
      var keyForArchive, coverSalt;
      button.textContent = '正在轻轻拆开……';
      message('正在本机解锁纪念册，无需等待完整聊天下载。', false);
      readCover().then(function (payload) {
        if (attempt !== token) throw problem('cancel', 'Stopped');
        button.textContent = '正在轻轻拆开……';
        message('小小来信已就绪，正在你的手机上解密。', false);
        // Yield so the progress label paints before decoding the large payload.
        return new Promise(function (resolve) { setTimeout(function () { resolve(payload); }, 30); });
      }).then(function (payload) {
        if (attempt !== token) throw problem('cancel', 'Stopped');
        var encoder = new TextEncoder();
        coverSalt = payload.salt;
        return window.crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey'])
          .then(function (material) {
            return window.crypto.subtle.deriveKey({name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256'}, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
          }).then(function (key) {
            keyForArchive = key;
            return window.crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(payload.iv), additionalData: encoder.encode('our-memory:cover:v1'), tagLength: 128}, key, decode(payload.ciphertext));
          });
      }).then(function (plain) {
        if (attempt !== token) return;
        var html = new TextDecoder('utf-8', {fatal: true}).decode(plain);
        if (html.indexOf('<!doctype html>') !== 0) throw problem('file', '解密后的文件不完整，请刷新后重试。');
        clearTimeout(deadline);
        password = ''; input.value = '';
        installArchiveLoader(keyForArchive, coverSalt);
        document.open(); document.write(html); document.close();
      }).catch(function (error) {
        if (attempt !== token) return;
        clearTimeout(deadline);
        password = ''; busy = false; button.disabled = false; button.textContent = '拆开来信 ♡';
        message(error.kind ? error.message : '口令不匹配，或文件不完整。请核对文字及中英文标点后重试。', true);
        help.hidden = !!(error.kind === 'file');
      });
    }, 0);
  }

  reveal.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    reveal.textContent = show ? '隐藏' : '显示';
    reveal.setAttribute('aria-pressed', String(show));
    hint.textContent = show ? '支持中文输入，口令默认可见；输入后可点「隐藏」。' : '口令已隐藏。继续输入中文时，请先点「显示」。';
  });
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () { composing = false; compositionEndedAt = Date.now(); });
  input.addEventListener('blur', function () { composing = false; });
  input.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.keyCode !== 13) return;
    event.preventDefault();
    if (event.isComposing || composing || event.keyCode === 229 || Date.now() - compositionEndedAt < 100) return;
    startUnlock();
  });
  button.addEventListener('click', startUnlock);
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (composing) { message('请先选好汉字，再点「拆开来信」。', false); return; }
    startUnlock();
  });
  button.disabled = false;
  button.textContent = '拆开来信 ♡';
  message('输入口令后，点「拆开来信」打开回忆。', false);
}());
